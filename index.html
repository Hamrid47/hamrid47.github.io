<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070a1c;--p:#7c3aed;--c:#22d3ee;--card:#ffffff12;--m:#9fb0d0}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:#fff;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-50% -50% 0;height:150%;background:linear-gradient(#22d3ee14 1px,transparent 1px),linear-gradient(90deg,#22d3ee14 1px,transparent 1px);background-size:44px 44px;transform:perspective(500px) rotateX(60deg);animation:grid 3s linear infinite;z-index:0}
@keyframes grid{to{background-position:0 44px}}
#fx{position:fixed;inset:0;z-index:0}
#scan{position:fixed;left:0;right:0;height:120px;background:linear-gradient(transparent,#22d3ee22,transparent);animation:scan 4s linear infinite;z-index:1;pointer-events:none}
@keyframes scan{from{top:-120px}to{top:100%}}
.hide{display:none!important}
svg.lg{width:84px;height:84px;filter:drop-shadow(0 0 14px #22d3ee99)}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.4);pointer-events:none}
#splash svg{width:130px;height:130px;animation:pop 1s cubic-bezier(.2,1.6,.4,1) both,spin 6s linear 1s infinite}
#splash h1{font-size:46px;letter-spacing:10px;margin-top:20px;animation:rise .8s .6s both}
#splash p{color:var(--m);font-style:italic;font-size:13px;margin-top:8px;animation:rise .8s 1.1s both;padding:0 20px;text-align:center}
@keyframes pop{from{transform:scale(0) rotate(-180deg);opacity:0}}
@keyframes spin{50%{filter:hue-rotate(60deg) drop-shadow(0 0 30px #7c3aed)}}
@keyframes rise{from{opacity:0;transform:translateY(24px);letter-spacing:30px}}
/* auth */
.wrap{position:relative;z-index:2;max-width:420px;margin:0 auto;padding:28px 18px;animation:enter .7s both}
.brand{text-align:center;margin:10px 0 20px}
.brand h1{font-size:40px;letter-spacing:8px;background:linear-gradient(90deg,#c4b5fd,#22d3ee);-webkit-background-clip:text;color:transparent}
.brand p{color:var(--m);font-size:13px;font-style:italic;margin-top:6px}
.ring{width:110px;height:110px;margin:0 auto;display:grid;place-items:center;border-radius:50%;border:1px dashed #22d3ee88;animation:rot 12s linear infinite}
.ring svg{animation:rot 12s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.card{background:#0c1233cc;backdrop-filter:blur(16px);border:1px solid #22d3ee44;border-radius:22px;padding:22px;box-shadow:0 0 40px #7c3aed33,inset 0 0 30px #22d3ee0d}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff0d;color:var(--m);font-weight:700;transition:.25s}
.tabs .on{background:linear-gradient(90deg,var(--p),var(--c));color:#fff;box-shadow:0 0 18px #22d3ee66;transform:translateY(-2px)}
input,select{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ffffff2a;background:#ffffff0f;color:#fff;font-size:15px;transition:.25s}
select option{color:#000}
input:focus,select:focus{outline:0;border-color:var(--c);box-shadow:0 0 14px #22d3ee55}
.btn{position:relative;overflow:hidden;width:100%;padding:13px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--p),var(--c));color:#fff;font-weight:800;font-size:15px;transition:transform .15s,box-shadow .3s;box-shadow:0 6px 22px #7c3aed66}
.btn:active{transform:scale(.95)}
.btn.s{width:auto;padding:9px 14px;font-size:13px;margin:6px 6px 0 0}
.msg{font-size:13px;margin-top:10px;min-height:18px;color:#fca5a5}.msg.ok{color:#86efac}
.small{font-size:12px;color:var(--m)}
.step{animation:enter .4s both}
/* portal open wipe */
#wipe{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));clip-path:circle(0% at 50% 60%);pointer-events:none}
#wipe.go{animation:wipe 1.1s ease-in-out both}
@keyframes wipe{0%{clip-path:circle(0% at 50% 60%)}45%,60%{clip-path:circle(150% at 50% 60%)}100%{clip-path:circle(150% at 50% 60%);opacity:0}}
@keyframes enter{from{opacity:0;transform:scale(.93) translateY(18px);filter:blur(8px)}}
/* app */
#app{position:relative;z-index:2}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#070a1ccc;backdrop-filter:blur(12px);border-bottom:1px solid #22d3ee33;position:sticky;top:0;z-index:5}
header svg{width:34px;height:34px}
header b{font-size:20px;letter-spacing:4px;background:linear-gradient(90deg,#c4b5fd,#22d3ee);-webkit-background-clip:text;color:transparent}
.burger{margin-left:auto;background:#ffffff14;border:1px solid #22d3ee44;color:#fff;font-size:22px;width:42px;height:42px;border-radius:12px;order:3}
nav{position:fixed;top:0;left:0;width:280px;height:100%;background:#0a0f2ef2;backdrop-filter:blur(18px);z-index:20;padding:20px 14px;transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);border-right:1px solid #22d3ee44;box-shadow:10px 0 40px #000a}
nav.open{transform:none}
.who{text-align:center;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid #ffffff1f}
.who img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:2px solid var(--c);box-shadow:0 0 18px #22d3ee88}
.nb{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:9px 0;border-radius:16px;border:1px solid #ffffff22;background:linear-gradient(180deg,#ffffff1a,#ffffff06);color:#fff;font-size:15px;font-weight:700;text-align:left;box-shadow:0 5px 0 #00000066;transition:transform .12s,box-shadow .12s;opacity:0}
nav.open .nb{animation:bin .5s calc(var(--i)*.07s + .15s) both}
@keyframes bin{from{opacity:0;transform:translateX(-50px) scale(.9)}to{opacity:1}}
.nb:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #00000066}
.nb i{font-style:normal;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#ffffff14}
.nb.on{background:linear-gradient(90deg,var(--p),var(--c));border-color:#fff6;box-shadow:0 5px 0 #4c1d95,0 0 22px #22d3ee66}
.nb span{margin-left:auto;opacity:.6}
.shade{position:fixed;inset:0;background:#000a;z-index:15}
main{padding:16px;max-width:820px;margin:0 auto}
main.enter{animation:enter .55s cubic-bezier(.2,.9,.2,1) both}
h2{margin:6px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid #22d3ee33;border-radius:18px;padding:18px 10px;text-align:center;font-weight:700;transition:.15s}
.tile:active{transform:scale(.95)}
.tile span{display:block;font-size:30px;margin-bottom:6px}
.vid,.sk,.ur{background:var(--card);border:1px solid #ffffff1f;border-radius:16px;padding:12px;margin:10px 0}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chips button{flex:none;padding:9px 15px;border-radius:20px;border:1px solid #22d3ee55;background:#ffffff0d;color:#fff;font-weight:700}
.chips .on{background:linear-gradient(90deg,var(--p),var(--c))}
.sk{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sk img{width:64px;height:64px;border-radius:12px;object-fit:contain;background:#fff}
.sk div{flex:1;min-width:140px}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--c);display:block;margin:0 auto 12px;background:#ffffff1a;box-shadow:0 0 22px #22d3ee66}
.ur{display:flex;gap:12px;align-items:center}
.ur img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ffffff22}
.ur .n{font-size:12px;color:var(--c);font-weight:800}
.foot{text-align:center;color:var(--m);font-size:12px;padding:22px}
#splash h1,.brand h1,header b{font-family:'Orbitron','Segoe UI',system-ui,sans-serif;font-weight:900}
#splash h1{font-size:40px;letter-spacing:8px}.brand h1{font-size:34px;letter-spacing:7px}header b{font-size:19px;letter-spacing:3px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<symbol id="logo" viewBox="0 0 100 100"><path d="M50 5 90 27.5v45L50 95 10 72.5v-45z" fill="#0c1233" stroke="url(#g)" stroke-width="4"/><path d="M33 30v40M67 30v40M33 50h34" stroke="url(#g)" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="50" cy="50" r="5" fill="#22d3ee"/></symbol></defs></svg>
<canvas id="fx"></canvas><div id="scan"></div>
<div id="splash"><svg><use href="#logo"/></svg><h1>HAMRID</h1><p>I'm weak in study, but I can read your minds!</p></div>
<div id="wipe"><svg class="lg" style="width:120px;height:120px"><use href="#logo"/></svg></div>

<div id="auth" class="wrap hide">
  <div class="brand"><div class="ring"><svg class="lg"><use href="#logo"/></svg></div><h1 style="margin-top:14px">HAMRID</h1><p>I'm weak in study, but I can read your minds!</p></div>
  <div class="card">
    <div class="tabs"><button id="tLogin" class="on" onclick="tab('login')">🔐 Login</button><button id="tReg" onclick="tab('reg')">✨ Register</button></div>
    <div id="fLogin" class="step"><input id="lEmail" type="email" placeholder="Email"><input id="lPass" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button></div>
    <div id="fReg" class="hide">
      <div id="s1"><input id="rEmail" type="email" placeholder="Email"><button class="btn" onclick="sendCode()">Send 6-digit code</button></div>
      <div id="s2" class="hide step"><p class="small">Code aap ki email par bhej diya gaya hai.</p><input id="rCode" inputmode="numeric" maxlength="8" placeholder="Code"><button class="btn" onclick="verifyCode()">Verify code</button></div>
      <div id="s3" class="hide step"><input id="rName" placeholder="Name"><input id="rContact" inputmode="tel" placeholder="Contact number"><input id="rPass" type="password" placeholder="Password (min 8 characters)"><button class="btn" onclick="finishReg()">Create account</button></div>
    </div><div id="amsg" class="msg"></div>
  </div>
</div>

<div id="app" class="hide">
  <header><svg><use href="#logo"/></svg><b>HAMRID</b><button class="burger" onclick="toggleNav()">☰</button></header>
  <div id="shade" class="shade hide" onclick="toggleNav()"></div>
  <nav id="nav">
    <div class="who"><img id="navImg"><div id="navName" style="margin-top:8px;font-weight:800"></div><div id="navRole" class="small"></div></div>
    <button class="nb" style="--i:0" data-p="dash" onclick="go('dash')"><i>🏠</i>Dashboard<span>›</span></button>
    <button class="nb" style="--i:1" data-p="profile" onclick="go('profile')"><i>👤</i>Profile<span>›</span></button>
    <button class="nb" style="--i:2" data-p="skins" onclick="go('skins')"><i>📱</i>Skins<span>›</span></button>
    <button class="nb hide" style="--i:3" id="navData" data-p="data" onclick="go('data')"><i>🗂️</i>Data<span>›</span></button>
    <button class="nb" style="--i:4" onclick="logout()"><i>🚪</i>Logout<span>›</span></button>
  </nav>
  <main id="view"></main><div class="foot" id="foot"></div>
</div>

<script>
const SUPABASE_URL='https://njguhbvgtvhdhqsmrcqm.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qZ3VoYnZndHZoZGhxc21yY3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDMzNTgsImV4cCI6MjEwNzY3OTM1OH0.S-dy8tQ81zqnHn29lE1a9-5reMm2R80jMCBH6kAw_n8';
const ADMIN_EMAIL='saaqirashid@gmail.com';
const BRANDS=['Infinix','Oppo','Vivo','Tecno','Xiaomi','iPhone'];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,prof=null,isAdmin=false,appOn=false,skinBrand='All',skinQ='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=(t,ok)=>{$('amsg').textContent=t;$('amsg').className='msg'+(ok?' ok':'')};
const opts=a=>a.map(b=>`<option>${b}</option>`).join('');

/* tech background */
(function(){const c=$('fx'),x=c.getContext('2d');let w,h,P;
function rs(){w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(70,w*h/15000|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6}))}
rs();addEventListener('resize',rs);
(function d(){x.clearRect(0,0,w,h);if(!appOn){P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle='#22d3ee';x.fillRect(p.x,p.y,2.5,2.5);for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,e=dx*dx+dy*dy;if(e<15000){x.strokeStyle='rgba(124,58,237,'+(1-e/15000)*.6+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}})}requestAnimationFrame(d)})()})();

function tab(w){const l=w==='login';$('fLogin').classList.toggle('hide',!l);$('fReg').classList.toggle('hide',l);$('tLogin').classList.toggle('on',l);$('tReg').classList.toggle('on',!l);
 const f=l?$('fLogin'):$('fReg');f.classList.remove('step');f.offsetHeight;f.classList.add('step');say('')}
async function doLogin(){say('Please wait...',true);
 const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});
 if(error)return say('Email ya password ghalat hai.');boot(true)}
async function sendCode(){const email=$('rEmail').value.trim();if(!email)return say('Email likhein.');say('Code bheja ja raha hai...',true);
 const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return say(error.message);
 $('s1').classList.add('hide');$('s2').classList.remove('hide');say('Code bhej diya gaya.',true)}
async function verifyCode(){const {error}=await sb.auth.verifyOtp({email:$('rEmail').value.trim(),token:$('rCode').value.trim(),type:'email'});
 if(error)return say('Code ghalat ya expire ho gaya.');$('s2').classList.add('hide');$('s3').classList.remove('hide');say('Email verify ho gayi. Ab details bharein.',true)}
async function finishReg(){const name=$('rName').value.trim(),contact=$('rContact').value.trim(),pw=$('rPass').value;
 if(!name||!contact||!pw)return say('Name, Contact aur Password lazmi hain.');if(pw.length<8)return say('Password kam az kam 8 characters ka ho.');
 const {data,error}=await sb.auth.updateUser({password:pw,data:{name,contact}});if(error)return say(error.message);
 await sb.from('profiles').upsert({id:data.user.id,email:data.user.email,name,contact});boot(true)}

async function boot(anim){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('auth').classList.remove('hide');$('app').classList.add('hide');appOn=false;return}
 me=session.user;isAdmin=me.email.toLowerCase()===ADMIN_EMAIL;
 let {data:p}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(!p){p={id:me.id,email:me.email,name:me.user_metadata?.name||'',contact:me.user_metadata?.contact||''};await sb.from('profiles').upsert(p)}
 prof=p;const show=()=>{appOn=true;$('auth').classList.add('hide');$('app').classList.remove('hide');$('navData').classList.toggle('hide',!isAdmin);
  $('foot').textContent=isAdmin?'Admin: SaaQi':'Hamrid';paintNav();go('dash')};
 if(anim){$('wipe').classList.add('go');setTimeout(show,520);setTimeout(()=>$('wipe').classList.remove('go'),1200)}else show();
}
function paintNav(){$('navImg').src=prof.avatar_url||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74"><rect width="74" height="74" fill="#3b2a8c"/><text x="37" y="48" font-size="34" text-anchor="middle">👤</text></svg>');
 $('navName').textContent=prof.name||me.email;$('navRole').textContent=isAdmin?'Admin: SaaQi':'Member'}
function toggleNav(){const o=$('nav').classList.toggle('open');$('shade').classList.toggle('hide',!o)}
function go(p){document.querySelectorAll('.nb[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 $('nav').classList.remove('open');$('shade').classList.add('hide');
 const v=$('view');v.classList.remove('enter');v.offsetHeight;v.classList.add('enter');({dash:dashboard,profile:profilePage,skins:skinsPage,data:dataPage})[p]()}
async function logout(){try{await Promise.race([sb.auth.signOut({scope:'local'}),new Promise(r=>setTimeout(r,1500))])}catch(e){}Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));location.reload()}
sb.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY'){const p=prompt('Naya password (min 8 characters)');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(()=>alert('Password badal gaya.'))}});

/* dashboard + tutorials */
function dashboard(){$('view').innerHTML=`<h2>Salaam, ${esc(prof.name)} 👋</h2><div class="grid">
 <div class="tile" onclick="go('skins')"><span>📱</span>Skins</div><div class="tile" onclick="tutorialBrands()"><span>🎬</span>Tutorial</div>
 <div class="tile" onclick="go('profile')"><span>👤</span>Profile</div>${isAdmin?'<div class="tile" onclick="go(\'data\')"><span>🗂️</span>Data</div>':''}</div>`}
function tutorialBrands(){$('view').innerHTML=`<h2>🎬 Tutorial</h2><p class="small" style="margin-bottom:10px">Mobile brand chunein:</p><div class="grid">${BRANDS.map(b=>`<div class="tile" onclick="tutorialList('${b}')">${b}</div>`).join('')}</div>`}
async function tutorialList(brand){$('view').innerHTML=`<h2>🎬 ${esc(brand)} tutorials</h2><div id="tl">Loading...</div><button class="btn" onclick="tutorialBrands()">← Back</button>`;
 const {data}=await sb.from('tutorials').select('*').eq('brand',brand).order('id');
 $('tl').innerHTML=(data&&data.length)?data.map(t=>`<div class="vid"><b>${esc(t.title)}</b>${player(t.video_url)}</div>`).join(''):'<p class="small">Abhi is brand ki video nahi lagi.</p>'}
function player(u){const m=String(u).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:`<video src="${esc(u)}" controls></video>`}

/* profile */
function profilePage(){$('view').innerHTML=`<h2>Profile</h2><div class="card"><img class="avatar" src="${esc(prof.avatar_url||'')}" onerror="this.removeAttribute('src')">
 <input type="file" id="pFile" accept="image/*" class="hide" onchange="upAvatar(this.files[0])"><button class="btn" style="margin-top:0" onclick="$('pFile').click()">📷 Photo badlein</button>
 <input id="pName" value="${esc(prof.name)}" placeholder="Name" style="margin-top:14px"><input value="${esc(prof.email)}" disabled><input value="${esc(prof.contact)}" disabled>
 <button class="btn" onclick="saveName()">Save name</button><div id="pmsg" class="msg"></div></div>`}
async function saveName(){const name=$('pName').value.trim();if(!name)return;const {error}=await sb.from('profiles').update({name}).eq('id',me.id);
 if(!error){prof.name=name;paintNav();$('pmsg').className='msg ok';$('pmsg').textContent='Save ho gaya.'}else $('pmsg').textContent=error.message}
async function upAvatar(f){if(!f)return;$('pmsg').className='msg ok';$('pmsg').textContent='Upload ho rahi hai...';
 const path=me.id+'/avatar-'+Date.now()+'.'+(f.name.split('.').pop()||'jpg');const {error}=await sb.storage.from('avatars').upload(path,f,{upsert:true});
 if(error){$('pmsg').className='msg';return $('pmsg').textContent=error.message}
 const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;await sb.from('profiles').update({avatar_url:url}).eq('id',me.id);prof.avatar_url=url;paintNav();profilePage()}

/* skins data: skins.json (+ verified camera fixes in table skin_fix) */
let BUILT=null;const FIX={};
const mk=o=>{const f=FIX[o.model];if(f){o.cam=Array.isArray(f)?f:f.cam||[];o.cuts=f.cuts||[];o.fixed=1}o.svg=svgFor(o);o.preview_url='data:image/svg+xml;utf8,'+encodeURIComponent(o.svg);return o};
async function loadBuilt(){if(BUILT)return BUILT;let L=[];try{L=(await(await fetch('skins.json?v='+Date.now())).json()).models}catch(e){}
 try{const {data}=await sb.from('skin_fix').select('*');(data||[]).forEach(f=>FIX[f.model]=f.shapes)}catch(e){}
 BUILT=L.map(mk);return BUILT}
const n2=v=>+(+v).toFixed(2);
function geo(o){const r=o.r||(/11/.test(o.model)?9:10),t=o.t||8,M=12,G=8,bw=n2(o.w-1),bh=n2(o.h-1),cc=o.fixed?'R':'B';
 const cs=(ox,oy)=>(o.cam||[]).map(s=>s[0]==='c'?['c',n2(ox+s[1]),n2(oy+s[2]),s[3],cc]:['rr',n2(ox+s[1]),n2(oy+s[2]),s[3],s[4],s[5],cc]);
 const back=(ox,oy)=>[['rr',ox,oy,bw,bh,r,'R'],...cs(ox,oy)];
 if(o.only==='back')return{W:bw+2*M,H:bh+2*M,P:back(M,M)};
 const by=M+t,bx=M+t,x2=M+bw+2*t+G,x3=n2(x2+bw+G),W=n2(x3+bw+M),yb=n2(by+bh),H=n2(yb+t+M+14);
 const cross=[[bx,by-t],[bx+bw,by-t],[bx+bw,by],[bx+bw+t,by],[bx+bw+t,yb],[bx+bw,yb],[bx+bw,yb+t],[bx,yb+t],[bx,yb],[bx-t,yb],[bx-t,by],[bx,by]].map(q=>q.map(n2));
 const cuts=(o.cuts||[]).map(s=>['rr',n2(bx+s[1]),n2(by+s[2]),s[3],s[4],s[5],'R']);
 if(o.only==='wrap')return{W:n2(bw+2*t+2*M),H:n2(bh+2*t+2*M),P:[['p',cross,'R'],...cs(bx,by),...cuts]};
 const P=[['p',cross,'R'],...cs(bx,by),...cuts,...back(x2,by),['rr',x3,by,bw,bh,r,'R']];
 if(o.brand!=='iPhone')P.push(['c',n2(x3+bw/2),n2(by+5),4.5,'B']);
 const cy=yb+t+6;P.push(['t',n2(bx+bw/2),cy,3,'Back + Sides'],['t',n2(x2+bw/2),cy,3,'Back'],['t',n2(x3+bw/2),cy,3,'Front'],['t',n2(W/2),H-5,5,o.model]);
 return{W,H,P}}
function svgFor(o){const g=geo(o),f=o.fixed,at=c=>`fill="none" stroke="${c==='R'?'#FF0000':'#0000FF'}" stroke-width="0.1"`,
 sh=p=>{const k=p[0],a=at(p[p.length-1]);return k==='rr'?`<rect x="${p[1]}" y="${p[2]}" width="${p[3]}" height="${p[4]}" rx="${p[5]}" ry="${p[5]}" ${a}/>`:k==='c'?`<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]/2}" ${a}/>`:`<polygon points="${p[1].map(q=>q.join(',')).join(' ')}" ${a}/>`},
 G=c=>g.P.filter(p=>p[0]!=='t'&&p[p.length-1]===c).map(sh).join('');
 return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${g.W}mm" height="${g.H}mm" viewBox="0 0 ${g.W} ${g.H}"><title>${o.model} - Hamrid skin template</title>
<g id="BG-WHITE"><rect width="${g.W}" height="${g.H}" fill="#FFFFFF"/></g>
<g id="CUT-RED">${G('R')}</g>
<g id="CAMERA-${f?'CUT-RED':'VERIFY-BLUE'}">${G('B')}</g>
<g id="LABELS">${g.P.filter(p=>p[0]==='t').map(p=>`<text x="${p[1]}" y="${p[2]}" font-size="${p[3]}" text-anchor="middle" font-family="Arial">${p[4]}</text>`).join('')}</g></svg>`}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function dxfFor(o){const g=geo(o),F=(...a)=>a.join('\n')+'\n';let s=F(0,'SECTION',2,'HEADER',9,'$INSUNITS',70,4,0,'ENDSEC',0,'SECTION',2,'ENTITIES');
 const ln=(a,b,c2,d,L,c)=>{if(Math.hypot(a-c2,b-d)>1e-6)s+=F(0,'LINE',8,L,62,c,10,a,20,g.H-b,11,c2,21,g.H-d)};
 const rr=([x,y,w,h,r],L,c)=>{const ar=(cx,cy,a1,a2)=>s+=F(0,'ARC',8,L,62,c,10,cx,20,g.H-cy,40,r,50,a1,51,a2);
  ln(x+r,y+h,x+w-r,y+h,L,c);ln(x+w,y+h-r,x+w,y+r,L,c);ln(x+w-r,y,x+r,y,L,c);ln(x,y+r,x,y+h-r,L,c);
  ar(x+r,y+h-r,180,270);ar(x+w-r,y+h-r,270,360);ar(x+w-r,y+r,0,90);ar(x+r,y+r,90,180)};
 g.P.forEach(p=>{if(p[0]==='t')return;const R=p[p.length-1]==='R',L=R?'CUT':'CAMERA',c=R?1:5;
  if(p[0]==='rr')rr(p.slice(1,6),L,c);else if(p[0]==='c')s+=F(0,'CIRCLE',8,L,62,c,10,p[1],20,g.H-p[2],40,p[3]/2);else p[1].forEach((q,i)=>{const z=p[1][(i+1)%p[1].length];ln(q[0],q[1],z[0],z[1],L,c)})});
 return s+F(0,'ENDSEC',0,'EOF')}
function pdfFor(o){const g=geo(o),k=72/25.4,PW=g.W*k,PH=g.H*k,m=v=>(v*k).toFixed(3);
 const rr=([x,y,w,h,r])=>{const Y=g.H-(y+h),c=r*.5523,X=x;return `${m(X+r)} ${m(Y)} m ${m(X+w-r)} ${m(Y)} l ${m(X+w-r+c)} ${m(Y)} ${m(X+w)} ${m(Y+r-c)} ${m(X+w)} ${m(Y+r)} c ${m(X+w)} ${m(Y+h-r)} l ${m(X+w)} ${m(Y+h-r+c)} ${m(X+w-r+c)} ${m(Y+h)} ${m(X+w-r)} ${m(Y+h)} c ${m(X+r)} ${m(Y+h)} l ${m(X+r-c)} ${m(Y+h)} ${m(X)} ${m(Y+h-r+c)} ${m(X)} ${m(Y+h-r)} c ${m(X)} ${m(Y+r)} l ${m(X)} ${m(Y+r-c)} ${m(X+r-c)} ${m(Y)} ${m(X+r)} ${m(Y)} c h S\n`};
 const ci=(cx,cy,d)=>{const r=d/2,Y=g.H-cy,e=r*.5523;return `${m(cx+r)} ${m(Y)} m ${m(cx+r)} ${m(Y+e)} ${m(cx+e)} ${m(Y+r)} ${m(cx)} ${m(Y+r)} c ${m(cx-e)} ${m(Y+r)} ${m(cx-r)} ${m(Y+e)} ${m(cx-r)} ${m(Y)} c ${m(cx-r)} ${m(Y-e)} ${m(cx-e)} ${m(Y-r)} ${m(cx)} ${m(Y-r)} c ${m(cx+e)} ${m(Y-r)} ${m(cx+r)} ${m(Y-e)} ${m(cx+r)} ${m(Y)} c h S\n`};
 const po=a=>a.map((q,i)=>`${m(q[0])} ${m(g.H-q[1])} ${i?'l':'m'}`).join(' ')+' h S\n';
 const body=g.P.map(p=>p[0]==='t'?`0 g BT /F1 ${(p[3]*k).toFixed(1)} Tf ${m(p[1]-p[4].length*p[3]*.26)} ${m(g.H-p[2])} Td (${p[4]}) Tj ET\n`:(p[p.length-1]==='R'?'1 0 0 RG ':'0 0 1 RG ')+(p[0]==='rr'?rr(p.slice(1,6)):p[0]==='c'?ci(p[1],p[2],p[3]):po(p[1]))).join('');
 const st=`1 1 1 rg 0 0 ${PW.toFixed(2)} ${PH.toFixed(2)} re f 0.283 w\n${body}`;
 const ob=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>',`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>`,`<</Length ${st.length}>>\nstream\n${st}\nendstream`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>'];
 let out='%PDF-1.4\n',off=[];ob.forEach((b,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${b}\nendobj\n`});const xr=out.length;
 return out+`xref\n0 6\n0000000000 65535 f \n`+off.map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`}
function dl(m,f){const o=(BUILT||[]).find(x=>x.model===m);if(!o)return;
 if(f==='SVG')save(new Blob([o.svg],{type:'image/svg+xml'}),m+'.svg');
 else if(f==='DXF')save(new Blob([dxfFor(o)],{type:'application/dxf'}),m+'.dxf');
 else if(f==='PDF')save(new Blob([pdfFor(o)],{type:'application/pdf'}),m+'.pdf');
 else{const g=geo(o),px=300/25.4,w=Math.round(g.W*px),h=Math.round(g.H*px),img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);c.toBlob(b=>save(b,m+'.png'))};
  img.src='data:image/svg+xml;utf8,'+encodeURIComponent(o.svg.split('stroke-width="0.1"').join('stroke-width="0.35"'))}}
/* admin: camera + side cuts adjust (verified fix saved for everyone) */
let EDIT=null;const cl=x=>JSON.parse(JSON.stringify(x||[]));
function camEdit(m){const o=BUILT.find(x=>x.model===m);EDIT={m,cam:cl(o.cam),cuts:cl(o.cuts)};edDraw()}
function edRows(k){return EDIT[k].map((s,i)=>`<div class="small" style="margin-top:8px">${s[0]==='c'?'Circle: x, y, diameter':'Rect: x, y, width, height, radius'} <button class="btn s" style="background:#b91c1c" onclick="EDIT.${k}.splice(${i},1);edDraw()">🗑</button></div><div style="display:flex;gap:4px">${s.slice(1).map((v,j)=>`<input type="number" step="0.1" value="${v}" onchange="EDIT.${k}[${i}][${j+1}]=+this.value;edDraw()">`).join('')}</div>`).join('')}
function addCut(k){const o=BUILT.find(x=>x.model===EDIT.m),t=o.t||8,bw=o.w-1,bh=o.h-1,u=t*.5;
 EDIT.cuts.push({L:['r',-t*.75,40,u,14,1],R:['r',bw+t*.25,50,u,14,1],B:['r',bw/2-6,bh+t*.25,12,u,1],T:['r',bw/2-4,-t*.75,8,u,1]}[k].map((v,i)=>i?n2(v):v));edDraw()}
function edDraw(){const o=BUILT.find(x=>x.model===EDIT.m),t=Object.assign({},o,{cam:EDIT.cam,cuts:EDIT.cuts,fixed:1,only:'wrap'});
 $('sl').innerHTML=`<h3 style="color:#22d3ee">${esc(EDIT.m)} - Camera & Cuts</h3><p class="small">Asli phone se mila kar mm mein theek karein. x,y = back panel ke top-left se. Side flap par cut ke liye x ya y minus (-) ya zyada rakhein.</p><img style="width:170px;background:#fff;border-radius:10px;margin:8px 0" src="data:image/svg+xml;utf8,${encodeURIComponent(svgFor(t))}">
 <h3 style="margin-top:8px">📷 Camera</h3>${edRows('cam')}<button class="btn s" onclick="EDIT.cam.push(['c',20,20,12]);edDraw()">+ Circle</button><button class="btn s" onclick="EDIT.cam.push(['r',5,5,30,30,8]);edDraw()">+ Rect</button>
 <h3 style="margin-top:12px">🔘 Side buttons / ports</h3>${edRows('cuts')}<button class="btn s" onclick="addCut('L')">+ Left</button><button class="btn s" onclick="addCut('R')">+ Right</button><button class="btn s" onclick="addCut('B')">+ Bottom port</button><button class="btn s" onclick="addCut('T')">+ Top mic</button>
 <button class="btn" onclick="edSave()">✅ Save (verified)</button><button class="btn s" onclick="drawSkins()">← Back</button>`}
async function edSave(){const {error}=await sb.from('skin_fix').upsert({model:EDIT.m,shapes:{cam:EDIT.cam,cuts:EDIT.cuts}});if(error)return alert(error.message+' (SQL part 3 chalayi?)');
 FIX[EDIT.m]={cam:EDIT.cam,cuts:EDIT.cuts};const i=BUILT.findIndex(x=>x.model===EDIT.m);BUILT[i]=mk(BUILT[i]);SK=[...BUILT,...SK.filter(x=>!x.svg)];drawSkins()}
/* skins */
let SK=[],skinSeries='';
async function skinsPage(){
 $('view').innerHTML=`<h2>📱 Skins</h2><p class="small" style="margin-bottom:8px">Formats: SVG, PDF, DXF (plotter/Cutmate), PNG. CDR ke liye SVG/PDF Corel mein khol kar Save As CDR karein. Neeli line camera = abhi verify nahi, ✅ = verified (laal cut).</p>${isAdmin?`<details class="card" style="margin-bottom:12px"><summary style="font-weight:800">＋ Naya skin add karein</summary>
 <select id="aBrand">${opts(BRANDS)}</select><input id="aSeries" placeholder="Series (e.g. iPhone 15 Series, Note 30)"><input id="aModel" placeholder="Model name (e.g. iPhone 15 Pro Max)">
 <p class="small">Vector file (.cdr / .svg / .eps / .pdf / .ai)</p><input id="aFile" type="file"><p class="small">Preview image (optional)</p><input id="aPrev" type="file" accept="image/*">
 <button class="btn" onclick="addSkin()">Upload skin</button><div id="smsg" class="msg"></div></details>`:''}
 <div class="chips" id="chips"></div><input id="sq" placeholder="🔍 Model search..." oninput="skinQ=this.value;drawSkins()"><div id="sl">Loading...</div>`;
 const {data}=await sb.from('skins').select('*').order('brand').order('series').order('model');SK=[...await loadBuilt(),...(data||[])];skinSeries='';drawSkins()}
function drawSkins(){
 $('chips').innerHTML=['All',...BRANDS].map(b=>`<button class="${b===skinBrand?'on':''}" onclick="skinBrand='${b}';skinSeries='';drawSkins()">${b}</button>`).join('');
 const q=skinQ.trim().toLowerCase(),B=SK.filter(s=>skinBrand==='All'||s.brand===skinBrand),ser=s=>s.series||'Other';
 const card=s=>`<div class="sk">${s.preview_url?`<img src="${esc(s.preview_url)}">`:''}<div><b>${esc(s.model)}${s.fixed?' ✅':''}</b><div class="small">${esc(s.brand)} • ${esc(ser(s))}</div></div>${s.svg?`${['SVG','PDF','DXF','PNG'].map(f=>`<button class="btn s" onclick="dl('${esc(s.model)}','${f}')">⬇ ${f}</button>`).join('')}`:`<a class="btn s" style="text-decoration:none" href="${esc(s.file_url)}" download target="_blank">⬇ Download</a>`}<button class="btn s" onclick="tutorialList('${esc(s.brand)}')">🎬 Tutorial</button>${isAdmin&&s.svg?`<button class="btn s" onclick="camEdit('${esc(s.model)}')">✏️ Camera & Cuts</button>`:''}${isAdmin&&!s.svg?`<button class="btn s" style="background:#b91c1c" onclick="delSkin(${s.id})">🗑</button>`:''}</div>`;
 if(q){const L=B.filter(s=>(s.model+' '+ser(s)+' '+s.brand).toLowerCase().includes(q));$('sl').innerHTML=L.length?L.map(card).join(''):'<p class="small">Koi model nahi mila.</p>';return}
 if(skinSeries){const L=B.filter(s=>ser(s)===skinSeries);$('sl').innerHTML=`<button class="btn s" onclick="skinSeries='';drawSkins()">← Sab series</button><h3 style="margin:10px 0;color:#22d3ee">${esc(skinSeries)} (${L.length} models)</h3>`+L.map(card).join('');return}
 const G={};B.forEach(s=>{(G[s.brand+'|'+ser(s)]=G[s.brand+'|'+ser(s)]||[]).push(s)});
 $('sl').innerHTML=Object.keys(G).length?`<div class="grid">${Object.values(G).map(a=>`<div class="tile" onclick="skinSeries='${esc(ser(a[0]))}';drawSkins()"><span>📱</span>${esc(ser(a[0]))}<div class="small">${esc(a[0].brand)} • ${a.length} models</div></div>`).join('')}</div>`:'<p class="small">Is brand ke skins jald add ho rahe hain.</p>'}
const safe=n=>Date.now()+'-'+n.replace(/[^\w.-]/g,'_');
async function addSkin(){const m=$('smsg'),f=$('aFile').files[0],model=$('aModel').value.trim();if(!f||!model){m.className='msg';return m.textContent='Model name aur vector file lazmi hain.'}
 m.className='msg ok';m.textContent='Upload ho raha hai...';
 const up=async file=>{const p='f/'+safe(file.name);const {error}=await sb.storage.from('skins').upload(p,file);if(error)throw error;return sb.storage.from('skins').getPublicUrl(p).data.publicUrl};
 try{const file_url=await up(f),pv=$('aPrev').files[0],preview_url=pv?await up(pv):null;
 const {error}=await sb.from('skins').insert({brand:$('aBrand').value,series:$('aSeries').value.trim(),model,file_url,preview_url});if(error)throw error;skinsPage()}
 catch(e){m.className='msg';m.textContent=e.message}}
async function delSkin(id){if(!confirm('Yeh skin delete karein?'))return;await sb.from('skins').delete().eq('id',id);SK=SK.filter(s=>s.id!==id);drawSkins()}

/* admin data */
async function dataPage(){if(!isAdmin)return go('dash');
 $('view').innerHTML='<h2>🗂️ Data</h2><div id="dl">Loading...</div>';
 const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
 if(error)return $('dl').textContent=error.message;
 $('dl').innerHTML=`<p class="small" style="margin-bottom:8px">Total users: <b>${data.length}</b> &nbsp;(Password secure hota hai, dikhaya nahi ja sakta; Reset bhej sakte hain.)</p>`+
 data.map((u,i)=>`<div class="ur"><div class="n">#${data.length-i}</div><img src="${esc(u.avatar_url||'')}" onerror="this.removeAttribute('src')"><div style="flex:1;min-width:0;word-break:break-all"><b>${esc(u.name)}</b><div class="small">📧 ${esc(u.email)}</div><div class="small">📞 ${esc(u.contact)}</div><div class="small">🗓 ${new Date(u.created_at).toLocaleDateString()}</div>
 <button class="btn s" onclick="resetPw('${esc(u.email)}')">🔑 Reset password</button></div></div>`).join('')+
 `<details class="card" style="margin-top:16px"><summary style="font-weight:800">＋ Tutorial video add karein</summary><select id="tBrand">${opts(BRANDS)}</select><input id="tTitle" placeholder="Title"><input id="tUrl" placeholder="YouTube ya video link"><button class="btn" onclick="addTut()">Add</button><div id="tmsg" class="msg"></div></details>`}
async function resetPw(e){const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});alert(error?error.message:'Reset email bhej di gayi.')}
async function addTut(){const t=$('tTitle').value.trim(),u=$('tUrl').value.trim();if(!t||!u)return;
 const {error}=await sb.from('tutorials').insert({brand:$('tBrand').value,title:t,video_url:u});$('tmsg').className='msg'+(error?'':' ok');$('tmsg').textContent=error?error.message:'Add ho gayi.'}

/* start: splash then app/login */
setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),700)},2800);
boot(false);
</script></body></html>
